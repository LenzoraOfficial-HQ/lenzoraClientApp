<div class="auth-container">
    <h2>Reset your password</h2>
    <p>Enter your email to receive a reset token.</p>
    
    <label>Email address</label>
    <input type="email" id="reset-email" placeholder="Enter your email" />
    
    <button onclick="requestResetToken()" style="background-color: #b89030; color: white;">Send Reset Link</button>
    <p id="forgot-message"></p>
</div>

<script>
async function requestResetToken() {
    const email = document.getElementById('reset-email').value;
    const messageEl = document.getElementById('forgot-message');
    
    try {
        const response = await fetch('http://localhost:8081/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        
        if (response.ok) {
            messageEl.innerText = "If an account exists, a token has been sent.";
            messageEl.style.color = "green";
            // Redirect to the token entry page after a delay
            setTimeout(() => window.location.href = "/reset-password.html", 2000);
        }
    } catch (error) {
        messageEl.innerText = "Error connecting to the server.";
        messageEl.style.color = "red";
    }
}
</script>
