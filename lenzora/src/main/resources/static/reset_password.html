<div class="auth-container">
    <h2>Create New Password</h2>
    
    <label>Reset Token</label>
    <input type="text" id="reset-token" placeholder="Paste your token here" />
    
    <label>New Password</label>
    <input type="password" id="new-password" placeholder="At least 8 characters" />
    
    <button onclick="submitNewPassword()" style="background-color: #b89030; color: white;">Reset Password</button>
    <p id="reset-message"></p>
</div>

<script>
async function submitNewPassword() {
    const token = document.getElementById('reset-token').value;
    const newPassword = document.getElementById('new-password').value;
    const messageEl = document.getElementById('reset-message');
    
    try {
        const response = await fetch('http://localhost:8081/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, newPassword: newPassword })
        });
        
        if (response.ok) {
            messageEl.innerText = "Password successfully reset! Redirecting to login...";
            messageEl.style.color = "green";
            setTimeout(() => window.location.href = "/login.html", 2000);
        } else {
            messageEl.innerText = "Invalid or expired token.";
            messageEl.style.color = "red";
        }
    } catch (error) {
        messageEl.innerText = "Error connecting to the server.";
    }
}
</script>
