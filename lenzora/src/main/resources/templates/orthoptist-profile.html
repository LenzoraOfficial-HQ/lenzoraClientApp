<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Details - Lenzora</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="w-100" style="max-width: 38rem">
        <p class="eyebrow">Orthoptist registration</p>
        <h1 class="h2">Professional details</h1>
        <p class="text-muted">Complete your professional information to submit your account for administrator review.</p>

        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

        <form th:action="@{/orthoptist/profile}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="licenseNumber" class="form-label">Professional license number</label>
                <input id="licenseNumber" name="licenseNumber" class="form-control" maxlength="50"
                       th:value="${licenseNumber}" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Contact number</label>
                <input id="phone" name="phone" type="tel" class="form-control"
                       th:value="${phone}" required>
            </div>

            <div class="mb-4">
                <label for="branch" class="form-label">Branch where you work</label>
                <input id="branch" name="branch" class="form-control"
                       th:value="${branch}" required>
            </div>

            <button type="submit" class="btn btn-primary">Submit for approval</button>
        </form>
    </section>
</main>
</body>
</html>
