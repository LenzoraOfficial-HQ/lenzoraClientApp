<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lenzora - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* ================= BODY ================= */

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fffdf7, #f8f1df);
            font-family: Arial, sans-serif;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        /* ================= LOGIN CARD ================= */

        .login-card {
            width: 400px;
            background-color: white;
            padding: 40px;
            border-radius: 18px;

            border: 1px solid #d4af37;

            box-shadow:
                    0 10px 30px rgba(184, 134, 11, 0.15);

            position: relative;
            overflow: hidden;
        }


        /* Gold line at the top */

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(
                    90deg,
                    #b8860b,
                    #d4af37,
                    #f0d77a,
                    #d4af37,
                    #b8860b
            );
        }


        /* ================= LOGO ================= */

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;

            color: #b8860b;

            margin-bottom: 8px;
        }


        .logo-line {
            width: 55px;
            height: 3px;

            background-color: #d4af37;

            margin: 0 auto 25px auto;

            border-radius: 5px;
        }


        /* ================= TEXT ================= */

        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;

            color: #222;

            margin-bottom: 8px;
        }


        .login-subtitle {
            text-align: center;
            color: #777;

            margin-bottom: 30px;
        }


        /* ================= LABELS ================= */

        .form-label {
            font-weight: 600;
            color: #555;
        }


        /* ================= INPUTS ================= */

        .form-control {
            height: 48px;

            border: 1px solid #d8c79a;

            border-radius: 9px;

            padding-left: 15px;
        }


        .form-control:focus {
            border-color: #c49a2e;

            box-shadow:
                    0 0 0 0.2rem rgba(212, 175, 55, 0.18);
        }


        /* ================= LOGIN BUTTON ================= */

        .login-button {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                    135deg,
                    #b8860b,
                    #d4af37,
                    #b8860b
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: all 0.2s ease;

            margin-top: 10px;
        }


        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 6px 15px rgba(184, 134, 11, 0.25);
        }


        .login-button:active {
            transform: translateY(0);
        }


        /* ================= FOOTER ================= */

        .welcome-text {
            text-align: center;

            margin-top: 25px;

            color: #b8860b;

            font-size: 14px;
            letter-spacing: 0.5px;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">
            LENZORA
        </div>

        <div class="logo-line"></div>


        <!-- TITLE -->

        <div class="login-title">
            Login to your account
        </div>

        <div class="login-subtitle">
            Welcome back to Lenzora
        </div>


        <!-- LOGIN FORM -->

        <form method="post" action="/login">

            <!-- CSRF TOKEN -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- USERNAME -->

            <div class="mb-3">

                <label for="username"
                       class="form-label">
                    Username
                </label>

                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label for="password"
                       class="form-label">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit"
                    class="login-button">

                Login

            </button>

        </form>


        <!-- FOOTER -->

        <div class="welcome-text">
            ✦ Welcome to Lenzora ✦
        </div>


    </div>

</div>


</body>

</html>
