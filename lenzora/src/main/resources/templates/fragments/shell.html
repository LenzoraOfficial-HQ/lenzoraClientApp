<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Sidebar. Pass the page key so the right item gets the gold pill:
     sidebar('dashboard' | 'place-order' | 'catalogue' | 'users' | 'reports' | 'settings') -->
<div class="col-md-2 sidebar p-4" th:fragment="sidebar(active)">

    <div class="logo mb-4">
        Lenzora
    </div>

    <nav>

        <a href="/" class="nav-link"
           th:classappend="${active == 'dashboard'} ? 'active'">
            <i class="bi bi-house-door"></i> Dashboard
        </a>

        <a href="/place-order" class="nav-link"
           th:classappend="${active == 'place-order'} ? 'active'">
            <i class="bi bi-cart3"></i> Place Order
        </a>

        <a href="/catalogue" class="nav-link"
           th:classappend="${active == 'catalogue'} ? 'active'">
            <i class="bi bi-box-seam"></i> Catalogue
        </a>

        <a href="/users" class="nav-link"
           th:classappend="${active == 'users'} ? 'active'">
            <i class="bi bi-people"></i> Users
        </a>

        <a href="/reports" class="nav-link"
           th:classappend="${active == 'reports'} ? 'active'">
            <i class="bi bi-bar-chart"></i> Reports
        </a>

        <a href="/settings" class="nav-link"
           th:classappend="${active == 'settings'} ? 'active'">
            <i class="bi bi-gear"></i> Settings
        </a>

    </nav>

</div>

<!-- Top bar: search, notifications, account -->
<div class="top-bar p-3 d-flex justify-content-between align-items-center"
     th:fragment="topbar">

    <div class="search-box">

        <i class="bi bi-search search-icon"></i>

        <input type="search"
               class="form-control"
               placeholder="Search orders, customers, frames...">

    </div>

    <div class="d-flex align-items-center gap-3">

        <a th:href="@{/notifications}"
           class="icon-button"
           aria-label="Notifications"
           title="View notifications">

            <i class="bi bi-bell"></i>

        </a>

        <span class="avatar" aria-label="Account">
            <i class="bi bi-person"></i>
        </span>

    </div>

</div>

</body>
</html>
