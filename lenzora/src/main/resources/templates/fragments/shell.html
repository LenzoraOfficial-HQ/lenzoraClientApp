<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Sidebar. Pass the page key so the right item gets the gold pill:
     sidebar('dashboard' | 'place-order' | 'admin' | 'admin-orders' | 'catalogue' | 'users' | 'reports' | 'settings')
     The client links belong to the orthoptists, the administration links to
     accounts whose app_user.user_role is ADMIN. Neither side sees the other's. -->
<div class="col-md-2 sidebar p-4" th:fragment="sidebar(active)">

    <div class="logo mb-4">
        Lenzora
    </div>

    <nav>

        <div sec:authorize="hasRole('ORTHOPTIST')">

            <a href="/" class="nav-link"
               th:classappend="${active == 'dashboard'} ? 'active'">
                <i class="bi bi-house-door"></i> Dashboard
            </a>

            <a href="/place-order" class="nav-link"
               th:classappend="${active == 'place-order'} ? 'active'">
                <i class="bi bi-cart3"></i> Place Order
            </a>

        </div>

        <div sec:authorize="hasRole('ADMIN')">

            <div class="nav-section">
                Administration
            </div>

            <a href="/admin" class="nav-link"
               th:classappend="${active == 'admin'} ? 'active'">
                <i class="bi bi-shield-lock"></i> Admin Portal
            </a>

            <a href="/admin/orders" class="nav-link"
               th:classappend="${active == 'admin-orders'} ? 'active'">
                <i class="bi bi-clipboard-check"></i> Order Review
            </a>

            <a href="/catalogue" class="nav-link"
               th:classappend="${active == 'catalogue'} ? 'active'">
                <i class="bi bi-box-seam"></i> Catalogue
            </a>

            <a href="/users" class="nav-link"
               th:classappend="${active == 'users'} ? 'active'">
                <i class="bi bi-people"></i> Users
            </a>

            <a href="/reports" class="nav-link"
               th:classappend="${active == 'reports'} ? 'active'">
                <i class="bi bi-bar-chart"></i> Reports
            </a>

            <a href="/settings" class="nav-link"
               th:classappend="${active == 'settings'} ? 'active'">
                <i class="bi bi-gear"></i> Settings
            </a>

        </div>

    </nav>

</div>

<!-- Top bar: search, notifications, account -->
<div class="top-bar p-3 d-flex justify-content-between align-items-center"
     th:fragment="topbar">

    <div class="search-box">

        <i class="bi bi-search search-icon"></i>

        <input type="search"
               class="form-control"
               placeholder="Search orders, customers, frames...">

    </div>

    <div class="d-flex align-items-center gap-3">

        <button type="button" class="icon-button" aria-label="Notifications">
            <i class="bi bi-bell"></i>
        </button>

        <span class="account">

            <span class="account-name" sec:authentication="name">user@lenzora.lk</span>

            <span class="role-chip" sec:authorize="hasRole('ADMIN')">Admin</span>

        </span>

        <span class="avatar" aria-label="Account">
            <i class="bi bi-person"></i>
        </span>

        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                <span>Log out</span>
            </button>
        </form>

    </div>

</div>

</body>
</html>
