<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenzora - Frames</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">
    <style>
        .sidebar, main {
            min-height: 100vh;
        }

        .frame-card {
            overflow: hidden;
            border: 1px solid var(--lenzora-border);
            border-radius: var(--lenzora-radius);
            background: var(--lenzora-surface);
            box-shadow: var(--lenzora-shadow-soft);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .frame-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--lenzora-shadow-md);
        }

        .frame-media {
            position: relative;
            height: 230px;
            background: var(--lenzora-surface-alt);
        }

        .frame-media img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: var(--lenzora-surface-alt);
        }

        .frame-media-fallback {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            gap: .35rem;
            color: var(--lenzora-text-muted);
            font-size: .85rem;
            text-align: center;
        }

        .frame-media-fallback i {
            font-size: 1.8rem;
            opacity: .55;
        }

        .frame-name {
            color: var(--lenzora-text);
        }

        .frame-tint {
            color: var(--lenzora-text-muted);
        }

        .frame-details {
            border-top: 1px dashed var(--lenzora-border);
            margin-top: .85rem;
            padding-top: .75rem;
            display: grid;
            gap: .35rem;
            font-size: .85rem;
        }

        .frame-details .row-line {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .frame-details .row-line span:first-child {
            color: var(--lenzora-text-muted);
        }

        .frame-price {
            color: var(--lenzora-text);
            font-weight: 700;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                min-height: auto;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/shell :: sidebar(${activeNav})}"></div>
        <main class="col-md-10 p-0">
            <div th:replace="~{fragments/shell :: topbar}"></div>
            <div class="p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                    <div>
                        <div class="eyebrow">Catalogue</div>
                        <h2 class="mb-1">Frames</h2>
                        <p class="text-muted mb-0">Browse the frame catalogue — photos, sizes and prices.</p>
                    </div>
                    <span class="badge bg-secondary align-self-center"
                          th:text="${#lists.size(frames) + ' frame(s)'}">0 frames</span>
                </div>
                <div class="row g-4" th:if="${!#lists.isEmpty(frames)}">
                    <div class="col-sm-6 col-xl-4" th:each="f : ${frames}">
                        <article class="frame-card h-100"
                                 th:with="hasImage=${f.imageUrl != null and !#strings.isEmpty(#strings.trim(f.imageUrl))}">
                            <div class="frame-media">
                                <div class="frame-media-fallback">
                                    <i class="bi bi-image"></i>
                                    <span>No image</span>
                                </div>
                                <img th:if="${hasImage}"
                                     th:src="${f.imageUrl}"
                                     th:alt="${f.brand + ' ' + f.model}"
                                     loading="lazy"
                                     onerror="this.style.display='none'">
                            </div>
                            <div class="p-3">
                                <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                                    <h5 class="frame-name mb-0" th:text="${f.brand + ' ' + f.model}">Brand Model</h5>
                                    <span class="badge bg-success" th:if="${f.available and f.active}">Available</span>
                                    <span class="badge bg-secondary" th:unless="${f.available and f.active}">Not orderable</span>
                                </div>
                                <p class="frame-tint small mb-0"
                                   th:text="${(f.colour == null ? '' : f.colour) + (f.size == null ? '' : ' · ' + f.size)}">
                                    Blue · 51-16
                                </p>

                                <div class="frame-details">
                                    <div class="row-line">
                                        <span>Material</span>
                                        <span th:text="${f.material == null or #strings.isEmpty(f.material) ? '-' : f.material}">Metal</span>
                                    </div>
                                    <div class="row-line">
                                        <span>Size</span>
                                        <span th:text="${f.size == null or #strings.isEmpty(f.size) ? '-' : f.size}">51-16</span>
                                    </div>
                                    <div class="row-line">
                                        <span>Supplier</span>
                                        <span th:text="${f.supplier != null ? f.supplier.supplierName : '-'}">Lenzora Supplies</span>
                                    </div>
                                </div>

                                <p class="frame-price mb-0 mt-3"
                                   th:text="${'Rs ' + #numbers.formatDecimal(f.price,1,'COMMA',2,'POINT')}">Rs 27,500.00</p>
                            </div>
                        </article>
                    </div>
                </div>
                <div class="card p-4 text-center" th:if="${#lists.isEmpty(frames)}">
                    <p class="text-muted mb-0">No frames are available to display right now.</p>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
