<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Shared theme colours -->
    <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--lenzora-font);
        }

        body {
            background-color: var(--lenzora-bg);
            color: var(--lenzora-text);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background-color: var(--lenzora-sidebar);
            color: var(--lenzora-sidebar-text);
            padding: 25px 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .sidebar li:hover {
            background-color: rgba(255, 255, 255, 0.06);
        }

        /* Main content */
        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
        }

        .profile {
            background-color: var(--lenzora-surface);
            padding: 10px 18px;
            border-radius: 8px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--lenzora-surface);
            padding: 25px;
            border-radius: var(--lenzora-radius);
            box-shadow: var(--lenzora-shadow-soft);
        }

        .card h3 {
            color: var(--lenzora-text-muted);
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

        /* Recent activity */
        .activity {
            background-color: var(--lenzora-surface);
            padding: 25px;
            border-radius: var(--lenzora-radius);
            box-shadow: var(--lenzora-shadow-soft);
        }

        .activity h2 {
            margin-bottom: 20px;
        }

        .activity-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--lenzora-border);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 180px;
            }

            .main {
                margin-left: 180px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>My App</h2>

    <ul>
        <li>Dashboard</li>
        <li>Users</li>
        <li>Products</li>
        <li>Reports</li>
        <li>Settings</li>
    </ul>
</div>

<!-- Main Dashboard -->
<div class="main">

    <!-- Header -->
    <div class="header">
        <h1>Dashboard</h1>

        <div class="profile">
            Welcome, Admin
        </div>
    </div>

    <!-- Dashboard Cards -->
    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <p>1,250</p>
        </div>

        <div class="card">
            <h3>Total Products</h3>
            <p>320</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p>856</p>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <p>$12,450</p>
        </div>

    </div>

    <!-- Recent Activity -->
    <div class="activity">

        <h2>Recent Activity</h2>

        <div id="activity-list">
            <div class="activity-item">
                <p>Loading recent activities...</p>
            </div>
        </div>

    </div>

</div>

<!-- JavaScript to fetch database audit logs and populate the table -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch('/api/activities')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('.activity tbody');
                if (!tbody) return;

                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">No recent activity found.</td></tr>';
                    return;
                }

                data.forEach(act => {
                    const formattedDate = act.createdAt ? new Date(act.createdAt).toLocaleDateString() : 'Today';
                    const userName = act.username || 'System User';
                    const actionDescription = `${act.auditAction} (${act.entityName || 'General'})`;

                    tbody.innerHTML += `
                        <tr>
                            <td>${userName}</td>
                            <td>${actionDescription}</td>
                            <td>${formattedDate}</td>
                            <td><span class="badge bg-success" style="background-color: #d1e7dd; color: #0f5132; padding: 5px 10px; border-radius: 12px; font-size: 12px;">Completed</span></td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                console.error("Error fetching activities:", error);
            });
    });
</script>

</body>
</html>
