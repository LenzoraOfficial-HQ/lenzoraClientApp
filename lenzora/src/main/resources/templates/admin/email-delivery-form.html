
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Email | Lenzora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --blue: #2878f0;
            --navy: #062b70;
            --charcoal: #252b39;
            --gold: #d6a923;
        }

        body {
            background: #f3f6fc;
            color: #172b4d;
            font-family: Georgia, "Times New Roman", serif;
        }

        .form-header {
            padding: 28px;
            border-radius: 20px;
            background: linear-gradient(120deg, #ffffff, #edf4ff);
            border: 1px solid #e0e9f8;
            margin-bottom: 24px;
        }

        .form-header h2 {
            color: var(--navy);
            font-weight: bold;
        }

        .form-card {
            background: white;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid #e5ebf5;
            box-shadow: 0 8px 25px rgba(20, 55, 110, 0.07);
        }

        .form-label {
            font-weight: bold;
            color: var(--navy);
        }

        .form-control,
        .form-select {
            padding: 12px 14px;
            border-color: #dce5f3;
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 0.2rem rgba(40, 120, 240, 0.12);
        }

        .btn-lenzora {
            background: linear-gradient(135deg, #2878f0, #062b70);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: bold;
        }

        .btn-lenzora:hover {
            color: white;
            opacity: 0.92;
        }

        .btn-cancel {
            border: 1px solid #c7d2e5;
            border-radius: 10px;
            padding: 12px 24px;
            color: #526583;
        }

        .pending-note {
            background: #fff5d9;
            color: #755500;
            border-radius: 10px;
            padding: 14px;
        }
    </style>
</head>

<body>
<div class="container py-5">

    <div class="form-header">
        <h2>Create Email</h2>
        <p class="text-secondary mb-0">
            Create an email delivery record for tracking.
        </p>
    </div>

    <div class="form-card">

        <form th:action="@{/admin/email-delivery/create}"
              th:object="${emailDelivery}"
              method="post">

            <div class="mb-4">
                <label for="recipientEmail" class="form-label">
                    Recipient Email
                </label>
                <input type="email"
                       class="form-control"
                       id="recipientEmail"
                       th:field="*{recipientEmail}"
                       maxlength="100"
                       placeholder="recipient@example.com"
                       required>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="recipientType" class="form-label">
                        Recipient Type
                    </label>
                    <select id="recipientType"
                            class="form-select"
                            th:field="*{recipientType}"
                            required>
                        <option value="PLATFORM_USER">Platform User</option>
                        <option value="SUPPLIER" selected>Supplier</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="orderId" class="form-label">
                        Order ID (Optional)
                    </label>
                    <input type="number"
                           class="form-control"
                           id="orderId"
                           th:field="*{orderId}"
                           min="1"
                           placeholder="Enter order ID">
                </div>
            </div>

            <div class="mb-4">
                <label for="subject" class="form-label">Subject</label>
                <input type="text"
                       class="form-control"
                       id="subject"
                       th:field="*{subject}"
                       maxlength="150"
                       placeholder="Enter email subject"
                       required>
            </div>

            <div class="mb-4">
                <label for="body" class="form-label">Email Message</label>
                <textarea class="form-control"
                          id="body"
                          th:field="*{body}"
                          rows="6"
                          placeholder="Write the email message here..."></textarea>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input"
                       type="checkbox"
                       id="containsPatientData"
                       th:field="*{containsPatientData}">
                <label class="form-check-label" for="containsPatientData">
                    This email contains patient data
                </label>
            </div>

            <div class="d-flex flex-wrap gap-3">
                <button type="submit" class="btn btn-lenzora">
                    Send Email
                </button>

                <a th:href="@{/admin/email-delivery}"
                   class="btn btn-cancel">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>
</body>
</html>
