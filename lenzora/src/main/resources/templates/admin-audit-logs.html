<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - Lenzora</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/shell :: sidebar('audit-logs')}"></div>
        <main class="col-md-10 p-4">
            <div th:replace="~{fragments/shell :: topbar}"></div>
            <header class="py-4">
                <div class="eyebrow">Administration</div>
                <h1 class="h2">Audit logs</h1>
                <p class="text-muted mb-0">Review recent user and administrative actions.</p>
            </header>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col">Time</th>
                        <th scope="col">Action</th>
                        <th scope="col">User</th>
                        <th scope="col">Target</th>
                        <th scope="col">Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="entry : ${auditLogs.content}">
                        <td th:text="${#temporals.format(entry.createdAt, 'dd MMM yyyy HH:mm:ss')}">Time</td>
                        <td th:text="${entry.auditAction}">Action</td>
                        <td th:text="${entry.username ?: '-'}">User</td>
                        <td th:text="${entry.entityName}">Target</td>
                        <td th:text="${entry.details}">Details</td>
                    </tr>
                    <tr th:if="${auditLogs.empty}">
                        <td colspan="5" class="text-muted py-4">No audit events have been recorded.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${auditLogs.totalPages > 1}" aria-label="Audit log pages">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${auditLogs.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/audit-logs(page=${auditLogs.number - 1})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link"
                              th:text="${auditLogs.number + 1 + ' / ' + auditLogs.totalPages}">1 / 1</span>
                    </li>
                    <li class="page-item" th:classappend="${auditLogs.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/audit-logs(page=${auditLogs.number + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>
</body>
</html>
