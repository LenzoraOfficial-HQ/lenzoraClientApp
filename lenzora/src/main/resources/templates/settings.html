<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lenzora - Settings</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>

        body {
            background-color: #f5f7fb;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0d6efd;
        }

        .nav-link {
            color: #555;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: #e8f1ff;
            color: #0d6efd;
        }

        .top-bar {
            background-color: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .settings-section {
            margin-bottom: 25px;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 sidebar p-4">

            <div class="logo mb-4">
                Lenzora
            </div>

            <nav>

                <!-- Dashboard -->
                <a href="/" class="nav-link">
                    🏠 Dashboard
                </a>

                <!-- Place Order -->
                <a href="/place-order" class="nav-link">
                    🛒 Place Order
                </a>

                <!-- Users -->
                <a href="/users" class="nav-link">
                    👥 Users
                </a>

                <!-- Reports -->
                <a href="/reports" class="nav-link">
                    📊 Reports
                </a>

                <!-- Settings -->
                <a href="/settings" class="nav-link active">
                    ⚙️ Settings
                </a>

            </nav>

        </div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="col-md-10 p-0">

            <!-- TOP BAR -->

            <div class="top-bar p-3 d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    Settings
                </h5>

                <div>

                    <span class="text-muted me-3">
                        Welcome, Admin
                    </span>

                    <button class="btn btn-outline-primary btn-sm">
                        Profile
                    </button>

                </div>

            </div>


            <!-- ================= PAGE CONTENT ================= -->

            <div class="p-4">

                <h2 class="mb-1">
                    Settings
                </h2>

                <p class="text-muted mb-4">
                    Manage your Lenzora system settings.
                </p>


                <!-- ================= ACCOUNT SETTINGS ================= -->

                <div class="card shadow-sm p-4 settings-section">

                    <h5 class="mb-4">
                        Account Settings
                    </h5>

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   class="form-control"
                                   value="admin">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   value="admin@lenzora.com">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                New Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter new password">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Confirm new password">

                        </div>

                    </div>

                </div>


                <!-- ================= SYSTEM SETTINGS ================= -->

                <div class="card shadow-sm p-4 settings-section">

                    <h5 class="mb-4">
                        System Settings
                    </h5>

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Language
                            </label>

                            <select class="form-select">

                                <option selected>
                                    English
                                </option>

                                <option>
                                    Sinhala
                                </option>

                                <option>
                                    Tamil
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Time Zone
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Sri Lanka (GMT +5:30)
                                </option>

                                <option>
                                    India (GMT +5:30)
                                </option>

                                <option>
                                    UTC
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- ================= NOTIFICATION SETTINGS ================= -->

                <div class="card shadow-sm p-4 settings-section">

                    <h5 class="mb-4">
                        Notification Settings
                    </h5>

                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               checked>

                        <label class="form-check-label">
                            Receive email notifications
                        </label>

                    </div>


                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               checked>

                        <label class="form-check-label">
                            Receive order notifications
                        </label>

                    </div>


                    <div class="form-check">

                        <input class="form-check-input"
                               type="checkbox">

                        <label class="form-check-label">
                            Receive system updates
                        </label>

                    </div>

                </div>


                <!-- ================= SAVE BUTTON ================= -->

                <div class="mt-3">

                    <button class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="/"
                       class="btn btn-outline-secondary ms-2">
                        Cancel
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
