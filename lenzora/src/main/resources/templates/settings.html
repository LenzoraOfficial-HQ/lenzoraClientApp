<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lenzora - Settings</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Shared theme colours -->
    <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">

    <style>

        .sidebar {
            min-height: 100vh;
        }

        .settings-section {
            margin-bottom: 25px;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- ================= SIDEBAR ================= -->

        <div th:replace="~{fragments/shell :: sidebar('settings')}"></div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="col-md-10 p-0">

            <!-- TOP BAR -->

            <div th:replace="~{fragments/shell :: topbar}"></div>


            <!-- ================= PAGE CONTENT ================= -->

            <div class="p-4">

                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <div class="eyebrow">
                            Welcome back
                        </div>

                        <h2 class="mb-1">
                            Settings
                        </h2>

                        <p class="text-muted mb-0">
                            Manage your Lenzora system settings.
                        </p>

                    </div>

                    <div class="date-chip">

                        <i class="bi bi-calendar3 date-chip-icon"></i>

                        <span class="date-chip-label">
                            Today
                        </span>

                        <span class="date-chip-value"
                              th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy')}">
                            27 Sep 2026
                        </span>

                        <i class="bi bi-chevron-down date-chip-chevron"></i>

                    </div>

                </div>


                <!-- ================= ACCOUNT SETTINGS ================= -->

                <div class="card shadow-sm p-4 settings-section">

                    <h5 class="mb-4">
                        Account Settings
                    </h5>

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   class="form-control"
                                   value="admin">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   value="admin@lenzora.com">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                New Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter new password">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Confirm new password">

                        </div>

                    </div>

                </div>


                <!-- ================= SYSTEM SETTINGS ================= -->

                <div class="card shadow-sm p-4 settings-section">

                    <h5 class="mb-4">
                        System Settings
                    </h5>

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Language
                            </label>

                            <select class="form-select">

                                <option selected>
                                    English
                                </option>

                                <option>
                                    Sinhala
                                </option>

                                <option>
                                    Tamil
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Time Zone
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Sri Lanka (GMT +5:30)
                                </option>

                                <option>
                                    India (GMT +5:30)
                                </option>

                                <option>
                                    UTC
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- ================= NOTIFICATION SETTINGS ================= -->

                <div class="card shadow-sm p-4 settings-section">

                    <h5 class="mb-4">
                        Notification Settings
                    </h5>

                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               checked>

                        <label class="form-check-label">
                            Receive email notifications
                        </label>

                    </div>


                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               checked>

                        <label class="form-check-label">
                            Receive order notifications
                        </label>

                    </div>


                    <div class="form-check">

                        <input class="form-check-input"
                               type="checkbox">

                        <label class="form-check-label">
                            Receive system updates
                        </label>

                    </div>

                </div>


                <!-- ================= SAVE BUTTON ================= -->

                <div class="mt-3">

                    <button class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="/"
                       class="btn btn-outline-secondary ms-2">
                        Cancel
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
