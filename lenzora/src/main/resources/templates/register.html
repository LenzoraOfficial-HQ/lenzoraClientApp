<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lenzora - Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* ================= BODY ================= */

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fffdf7, #f8f1df);
            font-family: Arial, sans-serif;
        }


        /* ================= CARD ================= */

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 430px;
            background-color: white;
            padding: 40px;
            border-radius: 18px;

            border: 1px solid #d4af37;

            box-shadow:
                    0 10px 30px rgba(184, 134, 11, 0.15);

            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;

            background: linear-gradient(
                    90deg,
                    #b8860b,
                    #d4af37,
                    #f0d77a,
                    #d4af37,
                    #b8860b
            );
        }


        /* ================= HEADINGS ================= */

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;

            color: #b8860b;

            margin-bottom: 8px;
        }

        .logo-line {
            width: 55px;
            height: 3px;

            background-color: #d4af37;

            margin: 0 auto 25px auto;

            border-radius: 5px;
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;

            color: #222;

            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;

            margin-bottom: 30px;
        }


        /* ================= FORMS ================= */

        .form-label {
            font-weight: 600;
            color: #555;
        }

        .form-control {
            height: 48px;

            border: 1px solid #d8c79a;

            border-radius: 9px;

            padding-left: 15px;
        }

        .form-control:focus {
            border-color: #c49a2e;

            box-shadow:
                    0 0 0 0.2rem rgba(212, 175, 55, 0.18);
        }

        .login-button {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                    135deg,
                    #b8860b,
                    #d4af37,
                    #b8860b
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: all 0.2s ease;

            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 6px 15px rgba(184, 134, 11, 0.25);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* ================= GOOGLE BUTTON ================= */

        .google-btn {
            width: 100%;
            height: 48px;
            background-color: white;
            border: 1px solid #d8c79a;
            border-radius: 9px;
            color: #555;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .google-btn:hover {
            background-color: #fffdf7;
            border-color: #b8860b;
            color: #222;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.12);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: 18px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5dbbe;
        }

        .divider::before {
            margin-right: .75em;
        }

        .divider::after {
            margin-left: .75em;
        }


        /* ================= MESSAGES ================= */

        .login-error {
            margin-bottom: 20px;
            padding: 12px;

            border: 1px solid #e2b7b7;
            border-radius: 9px;

            background-color: #fdf1f1;
            color: #a33;

            font-size: 14px;
            text-align: center;
        }


        /* ================= FOOTER ================= */

        .register-link {
            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 14px;
        }

        .register-link a {
            color: #b8860b;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">

        <!-- LOGO -->

        <div class="logo">
            LENZORA
        </div>

        <div class="logo-line"></div>


        <!-- TITLE -->

        <div class="login-title">
            Create your account
        </div>

        <div class="login-subtitle">
            Join Lenzora to manage optical orders
        </div>


        <!-- PROBLEM MESSAGE -->

        <div class="login-error"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
            Something was not right.
        </div>


        <!-- SIGN UP FORM -->

        <form method="post" action="/register">

            <!-- CSRF TOKEN -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- NAME -->

            <div class="mb-3">

                <label for="firstName"
                       class="form-label">
                    First name
                </label>

                <input type="text"
                       class="form-control"
                       id="firstName"
                       name="firstName"
                       placeholder="Enter your first name"
                       required>

            </div>

            <div class="mb-3">

                <label for="lastName"
                       class="form-label">
                    Last name
                </label>

                <input type="text"
                       class="form-control"
                       id="lastName"
                       name="lastName"
                       placeholder="Enter your last name"
                       required>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label for="email"
                       class="form-label">
                    Email
                </label>

                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>

            <!-- PASSWORD -->

            <div class="mb-3">

                <label for="password"
                       class="form-label">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="At least 8 characters"
                       minlength="8"
                       required>

            </div>

            <div class="mb-3">

                <label for="confirmPassword"
                       class="form-label">
                    Confirm password
                </label>

                <input type="password"
                       class="form-control"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Type the password again"
                       minlength="8"
                       required>

            </div>


            <!-- SUBMIT -->

            <button type="submit"
                    class="login-button">

                Create Account

            </button>

        </form>


        <!-- GOOGLE SIGN-UP OPTION -->

        <div class="divider" th:if="${googleLoginEnabled}">or continue with</div>

        <a href="/oauth2/authorization/google" class="google-btn"
           th:if="${googleLoginEnabled}">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Sign up with Google</span>
        </a>


        <!-- BACK TO LOGIN -->

        <div class="register-link">
            Already have an account?
            <a href="/login">Log in</a>
        </div>


    </div>

</div>


</body>

</html>
