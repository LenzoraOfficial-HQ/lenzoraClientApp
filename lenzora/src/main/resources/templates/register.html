<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lenzora - Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* ================= BODY ================= */

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fffdf7, #f8f1df);
            font-family: Arial, sans-serif;
        }


        /* ================= CARD ================= */

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 430px;
            background-color: white;
            padding: 40px;
            border-radius: 18px;

            border: 1px solid #d4af37;

            box-shadow:
                    0 10px 30px rgba(184, 134, 11, 0.15);

            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;

            background: linear-gradient(
                    90deg,
                    #b8860b,
                    #d4af37,
                    #f0d77a,
                    #d4af37,
                    #b8860b
            );
        }


        /* ================= HEADINGS ================= */

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;

            color: #b8860b;

            margin-bottom: 8px;
        }

        .logo-line {
            width: 55px;
            height: 3px;

            background-color: #d4af37;

            margin: 0 auto 25px auto;

            border-radius: 5px;
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;

            color: #222;

            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;

            margin-bottom: 30px;
        }


        /* ================= FORMS ================= */

        .form-label {
            font-weight: 600;
            color: #555;
        }

        .form-control {
            height: 48px;

            border: 1px solid #d8c79a;

            border-radius: 9px;

            padding-left: 15px;
        }

        .form-control:focus {
            border-color: #c49a2e;

            box-shadow:
                    0 0 0 0.2rem rgba(212, 175, 55, 0.18);
        }

        .login-button {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                    135deg,
                    #b8860b,
                    #d4af37,
                    #b8860b
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: all 0.2s ease;

            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 6px 15px rgba(184, 134, 11, 0.25);
        }

        .login-button:active {
            transform: translateY(0);
        }


        /* ================= MESSAGES ================= */

        .login-error {
            margin-bottom: 20px;
            padding: 12px;

            border: 1px solid #e2b7b7;
            border-radius: 9px;

            background-color: #fdf1f1;
            color: #a33;

            font-size: 14px;
            text-align: center;
        }


        /* ================= FOOTER ================= */

        .register-link {
            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 14px;
        }

        .register-link a {
            color: #b8860b;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">
            LENZORA
        </div>

        <div class="logo-line"></div>


        <!-- TITLE -->

        <div class="login-title">
            Create your account
        </div>

        <div class="login-subtitle">
            Join Lenzora to manage optical orders
        </div>


        <!-- PROBLEM MESSAGE -->

        <div class="login-error"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
            Something was not right.
        </div>


        <!-- SIGN UP FORM -->

        <form method="post" action="/register">

            <!-- CSRF TOKEN -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- NAME -->

            <div class="mb-3">

                <label for="firstName"
                       class="form-label">
                    First name
                </label>

                <input type="text"
                       class="form-control"
                       id="firstName"
                       name="firstName"
                       placeholder="Enter your first name"
                       required>

            </div>

            <div class="mb-3">

                <label for="lastName"
                       class="form-label">
                    Last name
                </label>

                <input type="text"
                       class="form-control"
                       id="lastName"
                       name="lastName"
                       placeholder="Enter your last name"
                       required>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label for="email"
                       class="form-label">
                    Email
                </label>

                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>

            <!-- PASSWORD -->

            <div class="mb-3">

                <label for="password"
                       class="form-label">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="At least 8 characters"
                       minlength="8"
                       required>

            </div>

            <div class="mb-3">

                <label for="confirmPassword"
                       class="form-label">
                    Confirm password
                </label>

                <input type="password"
                       class="form-control"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Type the password again"
                       minlength="8"
                       required>

            </div>


            <!-- SUBMIT -->

            <button type="submit"
                    class="login-button">

                Create Account

            </button>

        </form>


        <!-- BACK TO LOGIN -->

        <div class="register-link">
            Already have an account?
            <a href="/login">Log in</a>
        </div>


    </div>

</div>


</body>

</html>
