<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Processing - Lenzora</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="text-center" style="max-width: 34rem">
        <p class="eyebrow">Lenzora account</p>
        <h1 class="h2">Registration Processing</h1>
        <p class="text-muted">Please wait for admin approval. Your account will be available once your Orthoptist registration has been reviewed.</p>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary" type="submit">Log out</button>
        </form>
    </section>
</main>
</body>
</html>
