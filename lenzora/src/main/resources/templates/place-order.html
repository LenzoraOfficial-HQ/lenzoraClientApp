<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lenzora - Place Order</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>

        body {
            background-color: #f5f7fb;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0d6efd;
        }

        .nav-link {
            color: #555;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: #e8f1ff;
            color: #0d6efd;
        }

        .top-bar {
            background-color: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 sidebar p-4">

            <div class="logo mb-4">
                Lenzora
            </div>

            <nav>

                <!-- Dashboard -->
                <a href="/" class="nav-link">
                    🏠 Dashboard
                </a>

                <!-- Place Order -->
                <a href="/place-order" class="nav-link active">
                    🛒 Place Order
                </a>

                <!-- Other navigation items -->
                <a href="/users" class="nav-link">
                    👥 Users
                </a>

                <a href="/reports" class="nav-link">
                    📊 Reports
                </a>

                <a href="/settings" class="nav-link">
                    ⚙️ Settings
                </a>

            </nav>

        </div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="col-md-10 p-0">

            <!-- TOP BAR -->

            <div class="top-bar p-3 d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    Place Order
                </h5>

                <div>

                    <span class="text-muted me-3">
                        Welcome, Admin
                    </span>

                    <button class="btn btn-outline-primary btn-sm">
                        Profile
                    </button>

                </div>

            </div>


            <!-- PAGE CONTENT -->

            <div class="p-4">

                <h2 class="mb-1">
                    Place New Order
                </h2>

                <p class="text-muted mb-4">
                    Create a new customer order.
                </p>


                <!-- ================= ORDER FORM ================= -->

                <div class="card shadow-sm p-4">

                    <h5 class="mb-4">
                        Order Details
                    </h5>


                    <div class="row g-3">

                        <!-- Customer -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Customer
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Select Customer
                                </option>

                                <option>
                                    John Doe
                                </option>

                                <option>
                                    Sarah Smith
                                </option>

                                <option>
                                    Michael Lee
                                </option>

                                <option>
                                    Emma Wilson
                                </option>

                            </select>

                        </div>


                        <!-- Product -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Product
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Select Product
                                </option>

                                <option>
                                    Product A
                                </option>

                                <option>
                                    Product B
                                </option>

                                <option>
                                    Product C
                                </option>

                            </select>

                        </div>


                        <!-- Quantity -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input type="number"
                                   class="form-control"
                                   value="1"
                                   min="1">

                        </div>


                        <!-- Order Date -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Order Date
                            </label>

                            <input type="date"
                                   class="form-control">

                        </div>


                        <!-- Payment Method -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Payment Method
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Select Payment Method
                                </option>

                                <option>
                                    Cash
                                </option>

                                <option>
                                    Card
                                </option>

                                <option>
                                    Online Payment
                                </option>

                            </select>

                        </div>


                        <!-- Delivery Address -->

                        <div class="col-12">

                            <label class="form-label">
                                Delivery Address
                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      placeholder="Enter delivery address"></textarea>

                        </div>


                        <!-- Buttons -->

                        <div class="col-12 mt-4">

                            <button type="button"
                                    class="btn btn-primary me-2">
                                Place Order
                            </button>

                            <a href="/"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
