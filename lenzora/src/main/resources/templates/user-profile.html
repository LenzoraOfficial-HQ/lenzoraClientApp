<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lenzora - User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm p-4 border-0">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>User Profile Details</h3>
                <a href="/users" class="btn btn-outline-secondary btn-sm">Back to Users</a>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="text-muted small">Full Name</label>
                    <p class="fw-bold fs-5" th:text="${user.firstName + ' ' + user.lastName}">John Doe</p>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="text-muted small">Email Address</label>
                    <p class="fw-bold fs-5" th:text="${user.email}">email@example.com</p>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="text-muted small">Role</label>
                    <p><span class="badge bg-primary" th:text="${user.userRole}">ADMIN</span></p>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="text-muted small">Status</label>
                    <p><span class="badge bg-success" th:text="${user.userStatus}">ACTIVE</span></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
