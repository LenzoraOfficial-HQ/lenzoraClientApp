<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lenzora - Users</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Shared theme colours -->
  <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">

  <style>

    .sidebar {
      min-height: 100vh;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--lenzora-accent-soft);
      color: var(--lenzora-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="container-fluid">

  <div class="row">

    <!-- ================= SIDEBAR ================= -->

    <div th:replace="~{fragments/shell :: sidebar('users')}"></div>


    <!-- ================= MAIN CONTENT ================= -->

    <div class="col-md-10 p-0">

      <!-- TOP BAR -->

      <div th:replace="~{fragments/shell :: topbar}"></div>


      <!-- PAGE CONTENT -->

      <div class="p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

          <div>

            <div class="eyebrow">
              Welcome back
            </div>

            <h2 class="mb-1">
              Users
            </h2>

            <p class="text-muted mb-0">
              Manage Lenzora platform users.
            </p>

          </div>

          <div class="d-flex align-items-center gap-3">

            <div class="date-chip">

              <i class="bi bi-calendar3 date-chip-icon"></i>

              <span class="date-chip-label">
                Today
              </span>

              <span class="date-chip-value"
                    th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy')}">
                27 Sep 2026
              </span>

              <i class="bi bi-chevron-down date-chip-chevron"></i>

            </div>

            <button class="btn btn-primary">
              + Add New User
            </button>

          </div>

        </div>


        <!-- ================= USER TABLE ================= -->

        <div class="card shadow-sm p-4">

          <div class="d-flex justify-content-between align-items-center mb-3">

            <h5 class="mb-0">
              User List
            </h5>

            <input type="text"
                   class="form-control"
                   placeholder="Search users..."
                   style="width: 250px;">

          </div>


          <div class="table-responsive">

            <table class="table align-middle">

              <thead>

              <tr>

                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>

              </tr>

              </thead>


              <tbody>

              <!-- User 1 -->

              <tr>

                <td>

                  <div class="d-flex align-items-center">

                    <div class="user-avatar me-3">
                      JD
                    </div>

                    <div>
                      <strong>
                        John Doe
                      </strong>
                    </div>

                  </div>

                </td>

                <td>
                  john@example.com
                </td>

                <td>
                  User
                </td>

                <td>
                                    <span class="badge bg-success">
                                        Active
                                    </span>
                </td>

                <td>

                  <button class="btn btn-sm btn-outline-primary">
                    View
                  </button>

                </td>

              </tr>


              <!-- User 2 -->

              <tr>

                <td>

                  <div class="d-flex align-items-center">

                    <div class="user-avatar me-3">
                      SS
                    </div>

                    <div>
                      <strong>
                        Sarah Smith
                      </strong>
                    </div>

                  </div>

                </td>

                <td>
                  sarah@example.com
                </td>

                <td>
                  User
                </td>

                <td>
                                    <span class="badge bg-success">
                                        Active
                                    </span>
                </td>

                <td>

                  <button class="btn btn-sm btn-outline-primary">
                    View
                  </button>

                </td>

              </tr>


              <!-- User 3 -->

              <tr>

                <td>

                  <div class="d-flex align-items-center">

                    <div class="user-avatar me-3">
                      ML
                    </div>

                    <div>
                      <strong>
                        Michael Lee
                      </strong>
                    </div>

                  </div>

                </td>

                <td>
                  michael@example.com
                </td>

                <td>
                  User
                </td>

                <td>
                                    <span class="badge bg-warning text-dark">
                                        Pending
                                    </span>
                </td>

                <td>

                  <button class="btn btn-sm btn-outline-primary">
                    View
                  </button>

                </td>

              </tr>


              <!-- User 4 -->

              <tr>

                <td>

                  <div class="d-flex align-items-center">

                    <div class="user-avatar me-3">
                      EW
                    </div>

                    <div>
                      <strong>
                        Emma Wilson
                      </strong>
                    </div>

                  </div>

                </td>

                <td>
                  emma@example.com
                </td>

                <td>
                  User
                </td>

                <td>
                                    <span class="badge bg-danger">
                                        Inactive
                                    </span>
                </td>

                <td>

                  <button class="btn btn-sm btn-outline-primary">
                    View
                  </button>

                </td>

              </tr>

              </tbody>

            </table>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

</body>

</html>
