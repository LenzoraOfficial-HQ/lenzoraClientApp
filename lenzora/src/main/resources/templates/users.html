<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lenzora - Users</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Shared theme colours -->
  <link rel="stylesheet" th:href="@{/css/lenzora-theme.css}">

  <style>

    .sidebar {
      min-height: 100vh;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--lenzora-accent-soft, #f9f3e2);
      color: var(--lenzora-accent, #b8860b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="container-fluid">

  <div class="row">

    <!-- ================= SIDEBAR ================= -->
    <div th:replace="~{fragments/shell :: sidebar('users')}"></div>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="col-md-10 p-0">

      <!-- TOP BAR -->
      <div th:replace="~{fragments/shell :: topbar}"></div>

      <!-- PAGE CONTENT -->
      <div class="p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

          <div>
            <div class="eyebrow text-muted small text-uppercase fw-bold">
              Welcome back
            </div>
            <h2 class="mb-1">
              Users
            </h2>
            <p class="text-muted mb-0">
              Manage Lenzora platform users.
            </p>
          </div>

          <div class="d-flex align-items-center gap-3">

            <div class="date-chip border px-3 py-2 rounded bg-white shadow-sm d-flex align-items-center gap-2">
              <span class="date-chip-label text-muted">
                Today
              </span>
              <span class="date-chip-value fw-semibold"
                    th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy')}">
                27 Sep 2026
              </span>
            </div>

            <button class="btn btn-primary" style="background-color: #b8860b; border-color: #b8860b;">
              + Add New User
            </button>

          </div>

        </div>

        <!-- ================= USER TABLE ================= -->

        <div class="card shadow-sm p-4 border-0">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">
              User List
            </h5>

            <input type="text"
                   class="form-control"
                   placeholder="Search users..."
                   style="width: 250px;">
          </div>

          <div class="table-responsive">

            <table class="table align-middle">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <!-- Dynamic rows populated via JavaScript -->
              </tbody>
            </table>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- ================= DYNAMIC USER FETCH SCRIPT ================= -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch('/api/users')
        .then(response => {
            if (!response.ok) {
                throw new Error("Unauthorized or failed to fetch users");
            }
            return response.json();
        })
        .then(users => {
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = ''; // Clear rows

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No users found.</td></tr>`;
                return;
            }

            users.forEach(user => {
                const firstName = user.firstName || '';
                const lastName = user.lastName || '';
                const initials = ((firstName[0] || '') + (lastName[0] || '')).toUpperCase() || 'U';
                const fullName = `${firstName} ${lastName}`.trim() || user.email;

                let badgeClass = 'bg-secondary';
                let statusText = user.status ? user.status.toLowerCase() : 'active';
                statusText = statusText.charAt(0).toUpperCase() + statusText.slice(1);

                if (user.status === 'ACTIVE') {
                    badgeClass = 'bg-success';
                } else if (user.status === 'PENDING') {
                    badgeClass = 'bg-warning text-dark';
                } else if (user.status === 'INACTIVE') {
                    badgeClass = 'bg-danger';
                }

                const row = `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="user-avatar me-3">
                                    ${initials}
                                </div>
                                <div>
                                    <strong>${fullName}</strong>
                                </div>
                            </div>
                        </td>
                        <td>${user.email}</td>
                        <td>${user.role || 'User'}</td>
                        <td>
                            <span class="badge ${badgeClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td>
                            <a href="/users/view?id=${user.userId}" class="btn btn-sm btn-outline-primary">
                                View
                            </a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        })
        .catch(error => {
            console.error("Error loading users:", error);
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Failed to load users. Ensure you are logged in as Admin.</td></tr>`;
        });
});
</script>

</body>

</html>
