# "offline" profile - boots the app with NO database at all.
#
# Use it when MySQL/Aiven is unreachable and you only need the web layer:
#   .\mvnw spring-boot:run -Dspring-boot.run.profiles=offline
#
# ddl-auto=none is what makes this work: Hibernate then performs no schema
# migration during context refresh, so it never needs a JDBC connection.
# With ddl-auto=update a dead or missing database aborts startup.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Skip the JDBC metadata probe at startup (dialect is set explicitly in
# application.properties, so this information is not needed). Without this the
# probe still costs up to connection-timeout seconds before it is abandoned.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
