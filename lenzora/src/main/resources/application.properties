spring.application.name=lenzora
server.port=${PORT:8081}

# Development admin seed credentials are supplied by the ignored .env file.
lenzora.admin.email=${ADMIN_EMAIL:}
lenzora.admin.password=${ADMIN_PASSWORD:}

spring.thymeleaf.cache=false

# Static files (css, images) - never cached, so a colour change shows up.
spring.web.resources.cache.period=0

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=true

# Database connection comes from lenzora/.env or the process environment.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Initial administrator credentials come from lenzora/.env or the environment.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Password-reset email. Configure these environment variables before enabling
# password reset outside local development.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# update creates the tables in a private local database, so a fresh clone runs
# without any manual SQL. Set DDL_AUTO=none when DB_URL points at the shared team
# database, which already holds the schema and must never be altered.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

# The dialect is read from the connection, so it is not set here.
spring.jpa.open-in-view=true

# Hibernate prints the JDBC URL - with the user name and password - in its
# "Database info" block at INFO, so that one logger is kept quiet.
logging.level.org.hibernate.orm.connections.pooling=warn

# Google OAuth2. The client id and secret come from .env (GOOGLE_CLIENT_ID /
# GOOGLE_CLIENT_SECRET) or from the environment, so no secret is kept in git.
# The "Continue with Google" button only appears when the client id is set.

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

