spring.application.name=lenzora
server.port=8081

spring.thymeleaf.cache=false

# Static files (css, images) - never cached, so a colour change shows up.
spring.web.resources.cache.period=0

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Database connection comes from lenzora/.env or the process environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lenzora?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Initial administrator credentials come from lenzora/.env or the environment.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Password-reset email. Configure these environment variables before enabling
# password reset outside local development.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# update creates the tables in a private local database, so a fresh clone runs
# without any manual SQL. Set DDL_AUTO=none when DB_URL points at the shared team
# database, which already holds the schema and must never be altered.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Google OAuth2. Optional - set the client id and secret as environment
# variables to show the Google button on the login page.
