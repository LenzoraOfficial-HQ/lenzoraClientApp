spring.application.name=lenzora
server.port=8081

spring.thymeleaf.cache=false

# Static files (css, images) - never cached, so a colour change shows up.
spring.web.resources.cache.period=0

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Database. The connection comes from the .env file (see .env.example).
# Override with DB_URL, DB_USERNAME and DB_PASSWORD for another server.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Lenzora?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Password-reset email. Configure these environment variables before enabling
# password reset outside local development.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# none - Hibernate never alters the shared schema. Set DDL_AUTO=update only for
# a private local database that the application is allowed to build.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Google OAuth2. Optional - set the client id and secret as environment
# variables to show the Google button on the login page.
